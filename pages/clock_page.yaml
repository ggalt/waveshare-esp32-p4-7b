---
# Clock page - main_page with full-screen clock, weather icon, temperature
# Named main_page because loading_480px.yaml hardcodes lvgl.page.show: main_page after boot

color:
  - id: night_red
    hex: '851717'

globals:
  - id: colon_visible
    type: bool
    initial_value: 'true'

# Blink the colon every second
interval:
  - interval: 1s
    then:
      - lambda: |-
          id(colon_visible) = !id(colon_visible);
          lv_obj_set_style_text_opa(
            id(time_colon_label),
            id(colon_visible) ? LV_OPA_COVER : LV_OPA_TRANSP,
            LV_PART_MAIN
          );

lvgl:
  pages:
    - id: main_page
      styles: page_style
      <<: !include ../esphome-modular-lvgl-buttons/widgets/swipe_navigation.yaml
      widgets:
        # Weather icon - top left corner (recolored for dark background)
        - image:
            id: weather_condition_icon
            align: TOP_LEFT
            x: 20
            y: 20
            src: unknown_100
            image_recolor: white
            image_recolor_opa: COVER
        # Temperature - top right corner
        - label:
            id: weather_temperature_label
            align: TOP_RIGHT
            x: -20
            y: 20
            text_font: nunito_48
            text_color: white
            text: "--°"
        # Centered clock
        - obj:
            width: 100%
            height: 100%
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - obj:  # time row
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: END
                  height: SIZE_CONTENT
                  width: SIZE_CONTENT
                  widgets:
                    - label:
                        id: time_hours_label
                        text_font: clock_time_font_${clock_size}
                        text_color: white
                        text: "12"
                    - label:
                        id: time_colon_label
                        text_font: clock_time_font_${clock_size}
                        text_color: white
                        text: ":"
                    - label:
                        id: time_minutes_label
                        text_font: clock_time_font_${clock_size}
                        text_color: white
                        text: "00"
                    - label:
                        id: ampm_label
                        text_font: clock_ampm_font_${clock_size}
                        text_color: white
                        text: "AM"
                        pad_bottom: ${clock_ampm_pad_${clock_size}}
              - label:
                  id: date_label
                  text_font: nunito_36
                  text_color: white
                  text: "Monday, January 01"

script:
  - id: set_clock_page_colors_dark
    then:
      - lvgl.label.update:
          id: time_hours_label
          text_color: white
      - lvgl.label.update:
          id: time_colon_label
          text_color: white
      - lvgl.label.update:
          id: time_minutes_label
          text_color: white
      - lvgl.label.update:
          id: ampm_label
          text_color: white
      - lvgl.label.update:
          id: date_label
          text_color: white
      - lvgl.label.update:
          id: weather_temperature_label
          text_color: white
      - lvgl.image.update:
          id: weather_condition_icon
          image_recolor: white
          image_recolor_opa: COVER

  - id: set_clock_page_colors_light
    then:
      - lvgl.label.update:
          id: time_hours_label
          text_color: black
      - lvgl.label.update:
          id: time_colon_label
          text_color: black
      - lvgl.label.update:
          id: time_minutes_label
          text_color: black
      - lvgl.label.update:
          id: ampm_label
          text_color: black
      - lvgl.label.update:
          id: date_label
          text_color: black
      - lvgl.label.update:
          id: weather_temperature_label
          text_color: black
      - lvgl.image.update:
          id: weather_condition_icon
          image_recolor: black
          image_recolor_opa: COVER

  - id: set_clock_page_colors_night
    then:
      - lvgl.label.update:
          id: time_hours_label
          text_color: night_red
      - lvgl.label.update:
          id: time_colon_label
          text_color: night_red
      - lvgl.label.update:
          id: time_minutes_label
          text_color: night_red
      - lvgl.label.update:
          id: ampm_label
          text_color: night_red
      - lvgl.label.update:
          id: date_label
          text_color: night_red
      - lvgl.label.update:
          id: weather_temperature_label
          text_color: night_red
      - lvgl.image.update:
          id: weather_condition_icon
          image_recolor: night_red
          image_recolor_opa: COVER
