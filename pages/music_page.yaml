---
# Music player page (LMS) - album art, track info, progress, controls, volume

lvgl:
  pages:
    - id: music_page
      styles: page_style
      <<: !include ../esphome-modular-lvgl-buttons/widgets/swipe_navigation.yaml
      on_load:
        - lambda: 'id(lms_music_page_active) = true;'
        - script.execute: lms_update_overlay
        - script.execute: lms_force_poll
      on_unload:
        - lambda: 'id(lms_music_page_active) = false;'
      widgets:
        # Clock - top left corner
        - label:
            id: music_time_label
            align: TOP_LEFT
            x: 20
            y: 12
            text_font: nunito_36
            styles: primary_text_style
            text: ""
        # Temperature - top right corner
        - label:
            id: music_temp_label
            align: TOP_RIGHT
            x: -20
            y: 12
            text_font: nunito_36
            styles: primary_text_style
            text: ""
        - obj:
            width: 100%
            height: 100%
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 12
            pad_left: 40
            pad_right: 40
            widgets:
              # --- Top row: album art placeholder + track info ---
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_column: 24
                  widgets:
                    # Album art container
                    - obj:
                        id: lms_art_container
                        width: 200
                        height: 200
                        bg_color: 0x1A1A1A
                        bg_opa: COVER
                        radius: 12
                        scrollable: false
                        widgets:
                          # Placeholder icon (shown when no art available)
                          - label:
                              id: lms_art_placeholder
                              text_font: mdi_music_40
                              text_color: gray
                              align: CENTER
                              text: $mdi_music
                          # Real album art (hidden until first download)
                          - image:
                              id: lms_art_image
                              src: lms_album_art
                              align: CENTER
                              hidden: true
                    # Track info (title, artist, album)
                    - obj:
                        height: 200
                        flex_grow: 1
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: CENTER
                          flex_align_cross: START
                          pad_row: 4
                        widgets:
                          - label:
                              id: lms_title_label
                              text_font: nunito_36
                              styles: primary_text_style
                              long_mode: DOT
                              width: 100%
                              text: "--"
                          - label:
                              id: lms_artist_label
                              text_font: nunito_24
                              styles: secondary_text_style
                              long_mode: DOT
                              width: 100%
                              text: ""
                          - label:
                              id: lms_album_label
                              text_font: nunito_24
                              styles: secondary_text_style
                              long_mode: DOT
                              width: 100%
                              text: ""

              # --- Progress bar row ---
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                    pad_column: 12
                  widgets:
                    - label:
                        id: lms_elapsed_label
                        text_font: nunito_20
                        styles: secondary_text_style
                        text: "0:00"
                    - bar:
                        id: lms_progress_bar
                        flex_grow: 1
                        height: 6
                        min_value: 0
                        max_value: 1000
                        value: 0
                        indicator:
                          bg_color: white
                          radius: 3
                        bg_color: 0x333333
                        bg_opa: COVER
                        radius: 3
                    - label:
                        id: lms_remaining_label
                        text_font: nunito_20
                        styles: secondary_text_style
                        text: "-0:00"

              # --- Playback controls row ---
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_column: 40
                  widgets:
                    # Shuffle button
                    - button:
                        id: lms_btn_shuffle
                        width: 48
                        height: 48
                        bg_opa: TRANSP
                        on_click:
                          - script.execute: lms_toggle_shuffle
                        widgets:
                          - label:
                              id: lms_shuffle_icon_label
                              text_font: mdi_music_40
                              styles: secondary_text_style
                              align: CENTER
                              text: $mdi_shuffle_disabled
                    # Previous button
                    - button:
                        id: lms_btn_prev
                        width: 56
                        height: 56
                        bg_opa: TRANSP
                        on_click:
                          - script.execute: lms_skip_previous
                        widgets:
                          - label:
                              id: lms_prev_icon_label
                              text_font: mdi_music_40
                              styles: primary_text_style
                              align: CENTER
                              text: $mdi_skip_previous
                    # Play/Pause button
                    - button:
                        id: lms_btn_play
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: white
                        on_click:
                          - script.execute: lms_play_pause
                        widgets:
                          - label:
                              id: lms_play_icon_label
                              text_font: mdi_music_40
                              text_color: black
                              align: CENTER
                              text: $mdi_play
                    # Next button
                    - button:
                        id: lms_btn_next
                        width: 56
                        height: 56
                        bg_opa: TRANSP
                        on_click:
                          - script.execute: lms_skip_next
                        widgets:
                          - label:
                              id: lms_next_icon_label
                              text_font: mdi_music_40
                              styles: primary_text_style
                              align: CENTER
                              text: $mdi_skip_next
                    # Repeat button
                    - button:
                        id: lms_btn_repeat
                        width: 48
                        height: 48
                        bg_opa: TRANSP
                        on_click:
                          - script.execute: lms_toggle_repeat
                        widgets:
                          - label:
                              id: lms_repeat_icon_label
                              text_font: mdi_music_40
                              styles: secondary_text_style
                              align: CENTER
                              text: $mdi_repeat_off

              # --- Volume row ---
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_column: 12
                  widgets:
                    - label:
                        id: lms_volume_icon
                        text_font: mdi_music_40
                        styles: secondary_text_style
                        text: $mdi_volume_high
                    - slider:
                        id: lms_volume_slider
                        flex_grow: 1
                        height: 8
                        min_value: 0
                        max_value: 100
                        value: 50
                        indicator:
                          bg_color: white
                          radius: 4
                        bg_color: 0x333333
                        bg_opa: COVER
                        radius: 4
                        knob:
                          bg_color: white
                          radius: 10
                          width: 20
                          height: 20
                        on_press:
                          - lambda: 'id(lms_volume_adjusting) = true;'
                        on_release:
                          - lambda: |-
                              id(lms_volume_adjusting) = false;
                              int vol = lv_slider_get_value(id(lms_volume_slider));
                              id(lms_volume) = vol;
                          - script.execute:
                              id: lms_set_volume
                              volume_level: !lambda 'return lv_slider_get_value(id(lms_volume_slider));'
        # --- Offline overlay (hidden by default, highest z-order) ---
        - obj:
            id: lms_offline_overlay
            align: CENTER
            width: 100%
            height: 100%
            hidden: true
            bg_color: black
            bg_opa: 70%
            clickable: false
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 8
            widgets:
              - label:
                  id: lms_offline_icon
                  text_font: mdi_music_80
                  text_color: gray
                  width: 100%
                  text_align: CENTER
                  text: ""
              - label:
                  id: lms_offline_msg
                  text_font: nunito_48
                  text_color: gray
                  width: 100%
                  text_align: CENTER
                  text: ""
