            id(hourly_temp_20), id(hourly_temp_21), id(hourly_temp_22), id(hourly_temp_23)
          };
          for (int i = 0; i < 24; i++) {
            lv_obj_set_style_text_color(hourly_time[i], white_c, LV_PART_MAIN);
            lv_obj_set_style_text_color(hourly_temp[i], white_c, LV_PART_MAIN);
          }

