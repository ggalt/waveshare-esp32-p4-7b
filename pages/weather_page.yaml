          id: wp_pressure_value
          text_color: white
      - lvgl.label.update:
          id: wp_humidity_label
          text_color: white
      - lvgl.label.update:
          id: wp_humidity_value
          text_color: white
      - lvgl.label.update:
          id: wp_wind_label
          text_color: white
      - lvgl.label.update:
          id: wp_wind_value
          text_color: white
      - lvgl.image.update:
          id: wp_weather_condition_icon
          image_recolor: white
          image_recolor_opa: COVER
      - lvgl.image.update:
          id: forecast_icon_0
          image_recolor: white
          image_recolor_opa: COVER
      - lvgl.image.update:
          id: forecast_icon_1
          image_recolor: white
          image_recolor_opa: COVER
      - lvgl.image.update:
          id: forecast_icon_2
          image_recolor: white
          image_recolor_opa: COVER
