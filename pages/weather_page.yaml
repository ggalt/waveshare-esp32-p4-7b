---
# Weather detail page - current conditions, daily forecast, hourly forecast

lvgl:
  pages:
    - id: weather_page
      styles: page_style
      <<: !include ../esphome-modular-lvgl-buttons/widgets/swipe_navigation.yaml
      widgets:
        - obj:
            width: 100%
            height: 100%
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_row: 4
            pad_all: 20
            widgets:
              # --- Current conditions header row ---
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                    pad_column: 16
                  widgets:
                    # Left: condition icon + text
                    - obj:
                        height: SIZE_CONTENT
                        width: SIZE_CONTENT
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: START
                          flex_align_cross: CENTER
                          pad_column: 16
                        widgets:
                          - image:
                              id: wp_weather_condition_icon
                              src: unknown_100
                              image_recolor: white
                              image_recolor_opa: COVER
                          - label:
                              id: wp_condition_label
                              text_font: nunito_36
                              text_color: white
                              text: "--"
                    # Right: temperature + hi/lo
                    - obj:
                        height: SIZE_CONTENT
                        width: SIZE_CONTENT
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: START
                          flex_align_cross: END
                        widgets:
                          - label:
                              id: wp_temperature_label
                              text_font: nunito_72
                              text_color: white
                              text: "--°F"
                          - label:
                              id: wp_hilo_label
                              text_font: nunito_24
                              text_color: white
                              text: "--° / --°"

              # --- Detail rows ---
              # Air pressure
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: wp_pressure_label
                        text_font: nunito_24
                        text_color: white
                        text: "Air pressure"
                    - label:
                        id: wp_pressure_value
                        text_font: nunito_24
                        text_color: white
                        text: "-- inHg"

              # Humidity
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: wp_humidity_label
                        text_font: nunito_24
                        text_color: white
                        text: "Humidity"
                    - label:
                        id: wp_humidity_value
                        text_font: nunito_24
                        text_color: white
                        text: "--%"

              # Wind speed
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: wp_wind_label
                        text_font: nunito_24
                        text_color: white
                        text: "Wind speed"
                    - label:
                        id: wp_wind_value
                        text_font: nunito_24
                        text_color: white
                        text: "-- mph"

              # --- Forecast tabview ---
              - tabview:
                  id: forecast_tabview
                  width: 100%
                  height: 360
                  position: top
                  size: 36
