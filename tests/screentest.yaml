---
# ═══════════════════════════════════════════════════════════════════════════════
# Bedroom WaveShare ESP32-P4 WiFi6 Touch LCD 7B Display
# 4-page display with swipe navigation
# ═══════════════════════════════════════════════════════════════════════════════

substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"
  # LCD back light modes
  touchscreen_daytime_brightness: "100%"
  touchscreen_nighttime_brightness: "65%"
  touchscreen_night_hour: "0"
  touchscreen_night_minute: "0"
  touchscreen_idle_timeout: "60s"
  screen_night_hour: '0'
  screen_night_minute: '0'
  # Weather entity
  weather_entity: "weather.openweathermap"
  temperature_sensor: "sensor.openweathermap_temperature"

esphome:
  name: "bedroom-waveshare-display"
  friendly_name: "Bedroom WaveShare Display"
  comment: "Waveshare ESP32-P4 WiFi6 Touch LCD 7B - 4 Page Display"
  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page

logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: UART0

# Required for online_image component
http_request:
  useragent: esphome/device
  timeout: 10s

image:
  defaults:
    byte_order: little_endian

# ═══════════════════════════════════════════════════════════════════════════════
# SCRIPTS
# ═══════════════════════════════════════════════════════════════════════════════
script:
  # Time update script - runs every minute
  - id: time_update
    then:
      - lvgl.label.update:
          id: page1_time_label
          text: !lambda 'return id(system_time).now().strftime("%l:%M %p");'
      - lvgl.label.update:
          id: page4_time_label
          text: !lambda 'return id(system_time).now().strftime("%l:%M %p");'

  # Fetch daily weather forecast (5 days)
  - id: fetch_daily_forecast
    then:
      - logger.log:
          level: INFO
          format: "Requesting daily weather forecast..."
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            type: daily
            entity_id: ${weather_entity}
          capture_response: true
          response_template: >-
            {% set forecasts = response["${weather_entity}"].forecast %}
            {% set result = {
              'condition_0': forecasts[0].condition | default('unknown'),
              'temp_hi_0': forecasts[0].temperature | default(0) | round | string,
              'temp_lo_0': forecasts[0].templow | default(0) | round | string,
              'day_0': as_timestamp(forecasts[0].datetime) | timestamp_custom('%a'),
              'condition_1': forecasts[1].condition | default('unknown'),
              'temp_hi_1': forecasts[1].temperature | default(0) | round | string,
              'temp_lo_1': forecasts[1].templow | default(0) | round | string,
              'day_1': as_timestamp(forecasts[1].datetime) | timestamp_custom('%a'),
              'condition_2': forecasts[2].condition | default('unknown'),
              'temp_hi_2': forecasts[2].temperature | default(0) | round | string,
              'temp_lo_2': forecasts[2].templow | default(0) | round | string,
              'day_2': as_timestamp(forecasts[2].datetime) | timestamp_custom('%a'),
              'condition_3': forecasts[3].condition | default('unknown'),
              'temp_hi_3': forecasts[3].temperature | default(0) | round | string,
              'temp_lo_3': forecasts[3].templow | default(0) | round | string,
              'day_3': as_timestamp(forecasts[3].datetime) | timestamp_custom('%a'),
              'condition_4': forecasts[4].condition | default('unknown'),
              'temp_hi_4': forecasts[4].temperature | default(0) | round | string,
              'temp_lo_4': forecasts[4].templow | default(0) | round | string,
              'day_4': as_timestamp(forecasts[4].datetime) | timestamp_custom('%a')
            } %}
            {{ result | tojson }}
          on_success:
            - lambda: |-
                auto data = response["response"];
                id(daily_condition_0) = data["condition_0"].as<std::string>();
                id(daily_condition_1) = data["condition_1"].as<std::string>();
                id(daily_condition_2) = data["condition_2"].as<std::string>();
                id(daily_condition_3) = data["condition_3"].as<std::string>();
                id(daily_condition_4) = data["condition_4"].as<std::string>();
            # Update Day 0
            - lvgl.label.update:
                id: daily_day_0
                text: !lambda 'return response["response"]["day_0"].as<std::string>();'
            - lvgl.label.update:
                id: daily_temp_hi_0
                text: !lambda 'return response["response"]["temp_hi_0"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: daily_temp_lo_0
                text: !lambda 'return response["response"]["temp_lo_0"].as<std::string>() + "°";'
            - script.execute: update_daily_icon_0
            # Update Day 1
            - lvgl.label.update:
                id: daily_day_1
                text: !lambda 'return response["response"]["day_1"].as<std::string>();'
            - lvgl.label.update:
                id: daily_temp_hi_1
                text: !lambda 'return response["response"]["temp_hi_1"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: daily_temp_lo_1
                text: !lambda 'return response["response"]["temp_lo_1"].as<std::string>() + "°";'
            - script.execute: update_daily_icon_1
            # Update Day 2
            - lvgl.label.update:
                id: daily_day_2
                text: !lambda 'return response["response"]["day_2"].as<std::string>();'
            - lvgl.label.update:
                id: daily_temp_hi_2
                text: !lambda 'return response["response"]["temp_hi_2"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: daily_temp_lo_2
                text: !lambda 'return response["response"]["temp_lo_2"].as<std::string>() + "°";'
            - script.execute: update_daily_icon_2
            # Update Day 3
