    # ═══════════════════════════════════════════════════════════════════════════
    # PAGE 3: Placeholder (Coming Soon)
    # ═══════════════════════════════════════════════════════════════════════════
    - id: page3_placeholder
      styles: page_style
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe left - next page"
        - lvgl.page.next:
            animation: OUT_LEFT
            time: 300ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe right - previous page"
        - lvgl.page.previous:
            animation: OUT_RIGHT
            time: 300ms
      widgets:
        - label:
            align: CENTER
            text_font: nunito_48
            text_color: 0x666666
            text: "Coming Soon"

    # ═══════════════════════════════════════════════════════════════════════════
    # PAGE 4: Large Clock Display
    # ═══════════════════════════════════════════════════════════════════════════
    - id: page4_clock
      styles: page_style
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe left - next page"
        - lvgl.page.next:
            animation: OUT_LEFT
            time: 300ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe right - previous page"
        - lvgl.page.previous:
            animation: OUT_RIGHT
            time: 300ms
      widgets:
        # Temperature in upper-right corner
