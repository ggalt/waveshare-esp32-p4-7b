                text: !lambda 'return response["response"]["temp_lo_3"].as<std::string>() + "°";'
            - script.execute: update_daily_icon_3
            # Update Day 4
            - lvgl.label.update:
                id: daily_day_4
                text: !lambda 'return response["response"]["day_4"].as<std::string>();'
            - lvgl.label.update:
                id: daily_temp_hi_4
