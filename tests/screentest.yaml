# ═══════════════════════════════════════════════════════════════════════════════
# LVGL CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
lvgl:
  buffer_size: 100%
  pages:
    # ═══════════════════════════════════════════════════════════════════════════
    # PAGE 1: Full Image with Clock and Temperature overlay
    # ═══════════════════════════════════════════════════════════════════════════
    - id: main_page
      bg_color: 0x1A1A1A
      bg_opa: COVER
      # Swipe navigation: left = next, right = previous
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe left - next page"
        - lvgl.page.next:
            animation: OUT_LEFT
            time: 300ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe right - previous page"
        - lvgl.page.previous:
            animation: OUT_RIGHT
            time: 300ms
      widgets:
        # Centered album art image (auto-scaled to fit screen while maintaining aspect ratio)
        - image:
            id: page1_bg
            src: page1_background_image
            align: CENTER

        # Clock in upper-left corner
        - label:
            id: page1_time_label
            x: 20
            y: 15
            text_font: nunito_120
            text_color: 0xFFFFFF
            text: "12:00 PM"

        # Temperature in upper-right corner
        - label:
            id: page1_temp_label
            align: TOP_RIGHT
            x: -20
            y: 15
            text_font: nunito_120
            text_color: 0xFFFFFF
            text: "--°F"

    # ═══════════════════════════════════════════════════════════════════════════
    # PAGE 2: Weather Forecast
    # ═══════════════════════════════════════════════════════════════════════════
    - id: page2_weather
      bg_color: 0xFFFFFF
      bg_opa: COVER
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe left - next page"
        - lvgl.page.next:
            animation: OUT_LEFT
            time: 300ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - logger.log: "Swipe right - previous page"
        - lvgl.page.previous:
            animation: OUT_RIGHT
            time: 300ms
      widgets:
        # Current weather section (top)
        - obj:
            x: 0
            y: 0
            width: 1024
            height: 140
            bg_color: 0xFFFFFF
            widgets:
              # Current condition icon
              - label:
                  id: weather_current_icon
                  x: 30
                  y: 30
                  text_font: weather_icons_80
                  text_color: 0x666666
                  text: "\U000F0599"

              # Current condition text
              - label:
                  id: weather_condition_text
                  x: 130
                  y: 30
                  text_font: nunito_42
                  text_color: 0x000000
                  text: "Loading..."

              # "Updated" text
              - label:
                  id: weather_updated_label
                  x: 130
                  y: 80
                  text_font: nunito_18
                  text_color: 0x888888
                  text: "Weather data"

              # Current temperature (right side)
              - label:
                  id: weather_current_temp
                  align: TOP_RIGHT
                  x: -30
                  y: 20
                  text_font: nunito_48
                  text_color: 0x000000
                  text: "--°F"

        # Tab bar
        - obj:
            x: 0
            y: 140
            width: 1024
            height: 50
            bg_color: 0xFFFFFF
            widgets:
              # Daily tab
              - button:
                  id: daily_tab_btn
                  x: 150
                  y: 5
                  width: 200
                  height: 40
                  bg_opa: TRANSP
                  on_click:
                    - script.execute: show_daily_view
                  widgets:
                    - label:
                        id: daily_tab_label
                        align: CENTER
                        text_font: nunito_24
                        text_color: 0x2196F3
                        text: "Daily"

              # Hourly tab
              - button:
                  id: hourly_tab_btn
                  x: 674
                  y: 5
                  width: 200
                  height: 40
                  bg_opa: TRANSP
                  on_click:
                    - script.execute: show_hourly_view
                  widgets:
                    - label:
                        id: hourly_tab_label
                        align: CENTER
                        text_font: nunito_24
                        text_color: 0x666666
                        text: "Hourly"

              # Tab underline
              - obj:
                  x: 0
                  y: 45
                  width: 1024
                  height: 3
                  bg_color: 0x2196F3

        # Daily forecast container
        - obj:
            id: daily_forecast_container
            x: 0
            y: 195
            width: 1024
            height: 350
            bg_color: 0xFFFFFF
            widgets:
              # 5-day forecast in a row
              # Day 0
              - obj:
                  x: 12
                  y: 20
                  width: 195
                  height: 280
                  bg_opa: TRANSP
                  widgets:
                    - label:
                        id: daily_day_0
                        align: TOP_MID
                        y: 0
                        text_font: nunito_24
                        text_color: 0x000000
                        text: "---"
                    - label:
                        id: daily_icon_0
                        align: CENTER
                        y: -30
                        text_font: weather_icons_48
                        text_color: 0x666666
                        text: "\U000F0599"
                    - label:
                        id: daily_temp_hi_0
                        align: CENTER
                        y: 50
                        text_font: nunito_36
                        text_color: 0x000000
                        text: "--°"
                    - label:
                        id: daily_temp_lo_0
                        align: CENTER
                        y: 95
                        text_font: nunito_24
                        text_color: 0x888888
                        text: "--°"

              # Day 1
              - obj:
                  x: 217
                  y: 20
                  width: 195
                  height: 280
                  bg_opa: TRANSP
                  widgets:
                    - label:
                        id: daily_day_1
                        align: TOP_MID
                        y: 0
                        text_font: nunito_24
                        text_color: 0x000000
                        text: "---"
                    - label:
                        id: daily_icon_1
                        align: CENTER
                        y: -30
