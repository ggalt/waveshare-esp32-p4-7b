# ═══════════════════════════════════════════════════════════════════════════════
# HOME ASSISTANT SENSORS
# ═══════════════════════════════════════════════════════════════════════════════
sensor:
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: ${temperature_sensor}
    on_value:
      then:
        - lvgl.label.update:
            id: page1_temp_label
            text: !lambda 'return str_sprintf("%.0f°F", x);'
        - lvgl.label.update:
            id: page4_temp_label
            text: !lambda 'return str_sprintf("%.0f°F", x);'
        - lvgl.label.update:
            id: weather_current_temp
            text: !lambda 'return str_sprintf("%.0f °F", x);'

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    on_value:
      then:
        - lambda: 'id(current_condition) = x;'
        - lvgl.label.update:
            id: weather_condition_text
            text: !lambda |-
              std::string cond = x;
              // Capitalize first letter
              if (!cond.empty()) {
                cond[0] = toupper(cond[0]);
              }
              // Replace hyphens with spaces
              for (auto& c : cond) {
                if (c == '-') c = ' ';
              }
              return cond;
        - lvgl.label.update:
            id: weather_current_icon
            text: !lambda |-
              std::string cond = x;
              if (cond == "clear-night") return "\U000F0594";
              if (cond == "cloudy") return "\U000F0590";
              if (cond == "fog") return "\U000F0591";
              if (cond == "hail") return "\U000F0592";
              if (cond == "lightning") return "\U000F0593";
              if (cond == "lightning-rainy") return "\U000F067E";
              if (cond == "partlycloudy") return "\U000F0595";
              if (cond == "pouring") return "\U000F0596";
              if (cond == "rainy") return "\U000F0597";
              if (cond == "snowy") return "\U000F0598";
              if (cond == "snowy-rainy") return "\U000F067F";
              if (cond == "sunny") return "\U000F0599";
              if (cond == "windy") return "\U000F059D";
              if (cond == "windy-variant") return "\U000F059E";
              return "\U000F0599";

# Fetch weather on HA connect
api:
  on_client_connected:
    - delay: 3s
    - script.execute: fetch_daily_forecast
    - script.execute: fetch_hourly_forecast
    - logger.log: "Downloading background image..."
    - component.update: page1_background_image

# Refresh weather hourly
time:
  - platform: homeassistant
    id: !extend system_time
    on_time:
      - hours: '*'
        minutes: 0
        seconds: 30
        then:
          - script.execute: fetch_daily_forecast
          - script.execute: fetch_hourly_forecast

# ═══════════════════════════════════════════════════════════════════════════════
# ONLINE IMAGE (Page 1 background)
# ═══════════════════════════════════════════════════════════════════════════════
online_image:
  - url: "http://192.168.1.10:9000/music/7edaf9e6/cover_600x600"
    id: page1_background_image
    format: JPEG
    # resize: 1024x600
    type: RGB565
    update_interval: 60s
    on_download_finished:
      - logger.log: "Background image downloaded successfully"
      - lvgl.image.update:
          id: page1_bg
          src: page1_background_image

