                format: "Failed to fetch daily weather forecast"

  # Fetch hourly weather forecast (12 hours)
  - id: fetch_hourly_forecast
    then:
      - logger.log:
          level: INFO
          format: "Requesting hourly weather forecast..."
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            type: hourly
            entity_id: ${weather_entity}
          capture_response: true
          response_template: >-
            {% set forecasts = response["${weather_entity}"].forecast %}
            {% set result = {} %}
            {% for i in range(12) %}
              {% set result = result | combine({
                'condition_' ~ i: forecasts[i].condition | default('unknown'),
                'temp_' ~ i: forecasts[i].temperature | default(0) | round | string,
                'hour_' ~ i: as_timestamp(forecasts[i].datetime) | timestamp_custom('%l%p') | replace(' ', '')
              }) %}
            {% endfor %}
            {{ result | tojson }}
          on_success:
            - lambda: |-
                auto data = response["response"];
                for (int i = 0; i < 12; i++) {
                  std::string cond_key = "condition_" + std::to_string(i);
                  switch(i) {
                    case 0: id(hourly_condition_0) = data[cond_key].as<std::string>(); break;
                    case 1: id(hourly_condition_1) = data[cond_key].as<std::string>(); break;
                    case 2: id(hourly_condition_2) = data[cond_key].as<std::string>(); break;
                    case 3: id(hourly_condition_3) = data[cond_key].as<std::string>(); break;
                    case 4: id(hourly_condition_4) = data[cond_key].as<std::string>(); break;
                    case 5: id(hourly_condition_5) = data[cond_key].as<std::string>(); break;
                    case 6: id(hourly_condition_6) = data[cond_key].as<std::string>(); break;
                    case 7: id(hourly_condition_7) = data[cond_key].as<std::string>(); break;
                    case 8: id(hourly_condition_8) = data[cond_key].as<std::string>(); break;
                    case 9: id(hourly_condition_9) = data[cond_key].as<std::string>(); break;
                    case 10: id(hourly_condition_10) = data[cond_key].as<std::string>(); break;
                    case 11: id(hourly_condition_11) = data[cond_key].as<std::string>(); break;
                  }
                }
