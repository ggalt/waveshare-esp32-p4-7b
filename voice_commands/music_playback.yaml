# ##################################################
# Voice: Set volume
# Sets the player volume to a specific level (0-100)
# ##################################################
- id: "voice_set_volume"
  alias: "Voice: Set volume"
  trigger:
    - platform: conversation
      command:
        - "set [the] volume to {volume}"
        - "set [the] volume [to] {volume} percent"
        - "change [the] volume to {volume}"
        - "change [the] volume to {volume} percent"
  variables:
    device_name: "{{ device_attr(trigger.device_id, 'name') | lower | replace(' ', '_') | replace('-', '_') }}"
    player_entity: "{{ states('sensor.' ~ device_name ~ '_player_entity') }}"
    volume_level: "{{ trigger.slots.volume | int(0) }}"
  action:
    - service: select.select_option
      target:
        entity_id: select.office_waveshare_esp32_p4_touch_lcd_7b_display_page
      data:
        option: "Music"
    - if:
        - condition: template
          value_template: "{{ volume_level >= 0 and volume_level <= 100 }}"
      then:
        - service: squeezebox.call_method
          target:
            entity_id: "{{ player_entity }}"
          data:
            command: mixer
            parameters:
              - volume
              - "{{ volume_level }}"
        - set_conversation_response: "Volume set to {{ volume_level }} percent"
      else:
        - set_conversation_response: "Sorry, volume must be between 0 and 100"

# ##################################################
# Voice: Mute toggle
# Mutes or unmutes the player
# ##################################################
- id: "voice_mute_toggle"
  alias: "Voice: Mute toggle"
  trigger:
    - platform: conversation
      command:
        - "mute [the] [music]"
        - "unmute [the] [music]"
        - "toggle mute"
  variables:
    device_name: "{{ device_attr(trigger.device_id, 'name') | lower | replace(' ', '_') | replace('-', '_') }}"
    player_entity: "{{ states('sensor.' ~ device_name ~ '_player_entity') }}"
    is_muted: "{{ state_attr(player_entity, 'is_volume_muted') }}"
  action:
    - service: select.select_option
      target:
        entity_id: select.office_waveshare_esp32_p4_touch_lcd_7b_display_page
      data:
        option: "Music"
    - service: squeezebox.call_method
      target:
        entity_id: "{{ player_entity }}"
      data:
        command: mixer
        parameters:
          - muting
    - set_conversation_response: >
        {% if is_muted %}Unmuted{% else %}Muted{% endif %}
