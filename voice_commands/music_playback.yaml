# ##################################################
# Voice: Volume up
# Increases the player volume by 5
# ##################################################
- id: "voice_volume_up"
  alias: "Voice: Volume up"
  trigger:
    - platform: conversation
      command:
        - "volume up"
        - "turn [the] volume up"
        - "turn it up"
        - "louder"
  variables:
    device_name: "{{ device_attr(trigger.device_id, 'name') | lower | replace(' ', '_') | replace('-', '_') }}"
    player_entity: "{{ states('sensor.' ~ device_name ~ '_player_entity') }}"
  action:
    - service: select.select_option
      target:
        entity_id: select.office_waveshare_esp32_p4_touch_lcd_7b_display_page
      data:
        option: "Music"
    - service: squeezebox.call_method
      target:
        entity_id: "{{ player_entity }}"
      data:
        command: mixer
        parameters:
          - volume
          - "+5"
    - set_conversation_response: "Volume increased"

