# ##################################################
# Voice: Music skip
# Skips to next track
# ##################################################
- id: "voice_music_skip"
  alias: "Voice: Music skip"
  trigger:
    - platform: conversation
      command:
        - "skip [the] [current] [track]"
        - "next [track] [please]"
  variables:
    device_name: "{{ device_attr(trigger.device_id, 'name') | lower | replace(' ', '_') | replace('-', '_') }}"
    player_entity: "{{ states('sensor.' ~ device_name ~ '_player_entity') }}"
  action:
    - service: select.select_option
      target:
        entity_id: select.office_waveshare_esp32_p4_touch_lcd_7b_display_page
      data:
        option: "Music"
    - service: media_player.media_next_track
      target:
        entity_id: "{{ player_entity }}"
    - set_conversation_response: "Skipping to next track"

