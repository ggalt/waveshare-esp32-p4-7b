---
# Waveshare ESP32-P4 WiFi6 Touch LCD 7B - Digital Clock + Voice Assistant
# Full-screen clock display with voice assistant and media player

substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"
  # LCD backlight modes - Code in backlight_time.yaml
  # Day mode - starts at Sunrise - screen at 100%
  touchscreen_daytime_brightness: "100%"
  # Evening mode - starts at Sunset
  touchscreen_nighttime_brightness: "65%"
  # Night mode start time (default is midnight)
  touchscreen_night_hour: "0"
  touchscreen_night_minute: "0"
  # Idle timeout - In night mode backlight goes off after this
  touchscreen_idle_timeout: "60s"
  screen_night_hour: '0'
  screen_night_minute: '0'
  clock_size: !secret clock_size
  player_mac: !secret player_id
  player_entity: !secret player_entity

esp32:
  framework:
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

esphome:
  name: ws-esp32p4-touch-lcd-7b
  friendly_name: "Waveshare ESP32-P4 Touch LCD 7B"
  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page
    - priority: -100
      then:
        - component.update: player_mac_sensor
        - component.update: player_entity_sensor

# Overrides for the library's common/wifi.yaml (root config takes precedence)
wifi:
  # fast_connect skips the boot scan and can join a -90 dBm AP on the saved
  # channel instead of the strongest one; always scan instead.
  fast_connect: false
  # Post-connect roaming over esp32_hosted (C6 co-processor) fails with
  # 'Association Leave' + a ~31s scan hang, causing ~40s outages. A real
  # disconnect still rescans and joins the strongest AP.
  post_connect_roaming: false

# ESP32-C6 WiFi co-processor firmware update (flashed by the P4 over SDIO).
# Reports the C6's firmware version as a Home Assistant update entity; the
# install only happens when triggered from HA. Picks the newest version in
# the manifest that is <= the esp_hosted host library compiled into this
# build (2.12.13 on ESPHome 2026.10.2).
update:
  - platform: esp32_hosted
    name: "WiFi Co-processor Firmware"
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json

logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: USB_SERIAL_JTAG

# LMS volume ducking — lower external music player while voice assistant is active
globals:
  - id: lms_volume_pre_duck
    type: int
    initial_value: '0'
  - id: lms_is_ducked
    type: bool
    initial_value: 'false'

# Time update script - called by backlight_time.yaml on sync and every minute
script:
  - id: time_update
    then:
      - script.execute: apply_theme_colors
      - lvgl.label.update:
          id: time_hours_label
          text: !lambda 'return id(system_time).now().strftime("%l");'
      - lvgl.label.update:
          id: time_minutes_label
          text: !lambda 'return id(system_time).now().strftime("%M");'
      - lvgl.label.update:
          id: ampm_label
          text: !lambda 'return id(system_time).now().strftime("%p");'
      - lvgl.label.update:
          id: date_label
          text: !lambda 'return id(system_time).now().strftime("%A, %B %d");'
      - lvgl.label.update:
          id: music_time_label
          text: !lambda 'return id(system_time).now().strftime("%l:%M %p");'

  # Called by theme_style.yaml when current_theme select changes
  - id: on_theme_changed
    then:
      - script.execute: apply_theme_colors

  # Duck LMS music player volume when voice assistant activates
  - id: lms_duck_volume
    then:
      - if:
          condition:
            lambda: 'return !id(lms_is_ducked);'
          then:
            - lambda: |-
                id(lms_volume_pre_duck) = id(lms_volume);
                id(lms_is_ducked) = true;
            - script.execute:
                id: lms_set_volume
                volume_level: 10

  # Restore LMS music player volume after voice assistant finishes.
  # If a voice command changed the volume during the interaction (e.g.
  # "set volume to 50"), the 3-second LMS poll will have updated
  # lms_volume to the new value.  Only restore the pre-duck volume if
  # the current volume is still near the duck level (10).
  - id: lms_unduck_volume
    then:
      - if:
          condition:
            lambda: 'return id(lms_is_ducked);'
          then:
            - lambda: 'id(lms_is_ducked) = false;'
            - if:
                condition:
                  lambda: 'return id(lms_volume) <= 12;'
                then:
                  - script.execute:
                      id: lms_set_volume
                      volume_level: !lambda 'return id(lms_volume_pre_duck);'

  # Safety net: recover if the pipeline hangs (e.g. HA intent never completes).
  # Restarted on each on_start so the timeout resets; stopped on normal on_end/on_error.
  - id: voice_overlay_timeout
    mode: restart
    then:
      - delay: 30s
      - logger.log: "Voice overlay timeout — hiding stale overlay and recovering"
      - lvgl.widget.hide: voice_overlay
      - voice_assistant.stop:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 5s
      - script.execute: lms_unduck_volume
      - micro_wake_word.start:

  # Safety net for TTS playback: the package's on_end has an unbounded
  # wait_until(not announcing) that blocks forever if the speaker crashes and
  # leaves the media player stuck in ANNOUNCING state.  This watchdog runs as
  # a separate coroutine and ensures the wake word listener is restarted.
  # Also handles voice_assistant stuck in STREAMING_RESPONSE (is_running true)
  # due to the same speaker crash — see ESPHome issue #16755.
  - id: voice_playback_watchdog
    mode: restart
    then:
      # Wait for the media player to actually start announcing before we
      # monitor for completion.  on_tts_end fires before the media player
      # transitions to ANNOUNCING (~90 ms gap), so without this initial
      # wait the "not announcing" check below is immediately true.
      - wait_until:
          condition:
            media_player.is_announcing:
          timeout: 5s
      # Now wait for playback to finish.
      - wait_until:
          condition:
            and:
              - not:
                  media_player.is_announcing:
              - not:
                  media_player.is_playing:
          timeout: 45s
      - delay: 1s
      # If the timeout expired with media player still stuck, or if
      # voice_assistant is still in STREAMING_RESPONSE, force a clean stop
      # so we can restart the wake word listener.
      - if:
          condition:
            or:
              - media_player.is_announcing:
              - voice_assistant.is_running:
          then:
            - logger.log: "Playback watchdog — forcing recovery from stuck state"
            - voice_assistant.stop:
            - wait_until:
                condition:
                  not:
                    voice_assistant.is_running:
                timeout: 5s
      # Restore LMS volume (safety net in case on_end didn't run)
      - script.execute: lms_unduck_volume
      - if:
          condition:
            not:
              micro_wake_word.is_running:
          then:
            - logger.log: "Playback watchdog — restarting wake word detection"
            - micro_wake_word.start:

# Increase I2S speaker buffer from the hardware package's 100 ms to the new
# default of 500 ms.  The legacy I2S driver was removed in 2026.4.0 and the
# new driver needs a larger buffer to absorb task-scheduling jitter (the
# touchscreen alone can block the loop for >1 s).  100 ms caused repeated
# "Event/record queues desynced" restarts on long TTS announcements.
speaker:
  - id: !extend my_speaker
    buffer_duration: 500ms

# Extend media player with embedded alarm sound file
media_player:
  - id: !extend my_media_player
    files:
      - id: timer_alarm_sound
        file: sounds/timer_alarm.mp3

# Voice assistant visual feedback (merges with voice_assistant from package)
# Uses a top_layer overlay so it doesn't conflict with page_style or page content
voice_assistant:
  on_start:
    - script.stop: voice_playback_watchdog
    - script.execute: lms_duck_volume
    - if:
        condition:
          lambda: "return id(timer_alarm_active);"
        then:
          # Dismiss the alarm, abort the pipeline, and announce "Timer stopped".
          # Uses script.execute so it runs as a separate coroutine — the wait
          # and TTS steps happen after on_start returns.
          - script.execute: dismiss_timer_alarm
        else:
          - lvgl.obj.update:
              id: voice_overlay
              border_color: light_blue
          - lvgl.widget.show: voice_overlay
          - script.execute: voice_overlay_timeout
  on_listening:
    - lvgl.obj.update:
        id: voice_overlay
        border_color: ep_green
  on_tts_end:
    # Stop the safety-net timeout as soon as we receive a TTS response URL.
    # This must happen here rather than in on_end because the package's on_end
    # blocks on wait_until(announcement finished) BEFORE the main config's
    # on_end actions run (ESPHome merge order: package first, main config appended).
    # Without this, a long TTS playback exceeds the 30 s timeout and gets killed.
    - script.stop: voice_overlay_timeout
    - lvgl.widget.hide: voice_overlay
    # Start a watchdog that ensures wake word restarts after playback finishes
    # (or times out).  This runs independently of the package's on_end chain,
    # which can block forever if the media player gets stuck in ANNOUNCING state.
    - script.execute: voice_playback_watchdog
  on_end:
    - script.stop: voice_overlay_timeout
    - lvgl.widget.hide: voice_overlay
    # Restore LMS volume — runs after the package's on_end finishes waiting
    # for the announcement to complete, so TTS plays at ducked volume.
    - script.execute: lms_unduck_volume
  on_error:
    - script.stop: voice_overlay_timeout
    - script.stop: voice_playback_watchdog
    - lvgl.widget.hide: voice_overlay
    - script.execute: lms_unduck_volume

# Sun triggers for clock color changes (merges with sun: from backlight_time.yaml)
sun:
  id: sun_sun
  on_sunset:
    - then:
        - script.execute: apply_theme_colors
  on_sunrise:
    - then:
        - script.execute: apply_theme_colors

packages:
  # WiFi, captive portal, web server
  wifi: !include esphome-modular-lvgl-buttons/common/wifi.yaml
  # OTA updates with LVGL progress bar
  ota_screen: !include esphome-modular-lvgl-buttons/common/ota.yaml
  # Named colors
  colors: !include esphome-modular-lvgl-buttons/common/color.yaml
  # Nunito fonts (12-72px)
  fonts: !include esphome-modular-lvgl-buttons/common/fonts.yaml
  # MDI icon unicode mappings
  glyphs: !include esphome-modular-lvgl-buttons/common/mdi_glyph_substitutions.yaml
  # WiFi, CPU temp, uptime, device info sensors (stripped - no info screen labels)
  sensors: !include sensors_clock.yaml
  # LVGL theme, page/button styles
  theme_style: !include local/common/theme_style.yaml
  # Time sync (HA), sun tracking, brightness modes, idle dimming
  backlight: !include esphome-modular-lvgl-buttons/common/backlight_time.yaml
  # Board definition (chip, display, touch, audio, I2C)
  hardware: !include local/hardware/waveshare-esp32-p4-wifi6-touch-lcd-7b.yaml
  # Media player + voice assistant (wake word, noise suppression)
  media_voice: !include local/hardware/media_player-voice_assistant.yaml
  # Boot screen + api: with HA connection handling
  loading_screen: !include local/pages/loading_480px.yaml
  # "WiFi Offline" banner across the top of every page
  wifi_status: !include wifi_status.yaml
  # Weather condition icon + temperature from Home Assistant
  weather: !include weather_clock.yaml
  # Moon phase icon from Home Assistant
  moon_phase: !include moon_phase.yaml
  # Weather detail page data (sensors, forecast, 80px icons)
  weather_detail: !include weather_detail.yaml
  # Clock font sizes (small/medium/large) - set clock_size in secrets.yaml
  clock_fonts: !include clock_fonts.yaml
  # Lyrion Music Server player (HTTP JSON-RPC, polling, playback controls)
  music_player: !include music_player.yaml
  # Centralized theme colors (styles, globals, palette scripts)
  theme_colors: !include theme_colors.yaml
  # Page layouts (order matters: clock, weather, music after loading_screen)
  clock_page: !include pages/clock_page.yaml
  weather_page: !include pages/weather_page.yaml
  music_page: !include pages/music_page.yaml
  # Album search popup overlay on music page
  album_search_overlay: !include pages/album_search_overlay.yaml
  album_search: !include album_search.yaml
  # Timers
  timers: !include timers.yaml

lvgl:
  buffer_size: 100%
  top_layer:
    widgets:
      - obj:
          id: voice_overlay
          hidden: true
          width: 100%
          height: 100%
          bg_opa: TRANSP
          border_width: 10
          border_color: light_blue
          border_opa: COVER
          clickable: false
          scrollable: false

select:
  - platform: template
    name: "Display Page"
    id: display_page
    icon: mdi:book-open-page-variant
    optimistic: true
    options:
      - Clock
      - Weather
      - Music
    initial_option: Clock
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(display_page).active_index() == 0;'
            then:
              - lvgl.page.show: main_page
        - if:
            condition:
              lambda: 'return id(display_page).active_index() == 1;'
            then:
              - lvgl.page.show: weather_page
        - if:
            condition:
              lambda: 'return id(display_page).active_index() == 2;'
            then:
              - lvgl.page.show: music_page

text_sensor:
  - platform: template
    name: "Player MAC"
    id: player_mac_sensor
    update_interval: never
    lambda: |-
      return {"$player_mac"};
  - platform: template
    name: "Player Entity"
    id: player_entity_sensor
    update_interval: never
    lambda: |-
      return {"$player_entity"};


