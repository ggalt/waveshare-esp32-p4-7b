---
# Weather detail page data
# Provides sensor subscriptions, forecast fetching, and 80px icons for the weather detail page.
# The weather_page LVGL layout is defined in the main config file.

# --- Text sensors for weather detail page ---
text_sensor:
  # Duplicate condition subscription for weather page icon + condition label (internal)
  - platform: homeassistant
    entity_id: weather.forecast_home
    id: wp_weather_condition
    internal: true
    on_value:
      then:
        - script.execute: update_wp_condition_icon
        - script.execute: update_wp_condition_label

  # Duplicate temperature subscription for weather page (internal)
  - platform: homeassistant
    entity_id: weather.forecast_home
    attribute: temperature
    id: wp_outdoor_temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: wp_temperature_label
            text:
              format: "%s°F"
              args: ['id(wp_outdoor_temperature).state.c_str()']

  # Humidity
  - platform: homeassistant
    entity_id: weather.forecast_home
    attribute: humidity
    id: wp_humidity
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: wp_humidity_value
            text:
              format: "%s%%"
              args: ['id(wp_humidity).state.c_str()']

  # Air pressure
  - platform: homeassistant
    entity_id: weather.forecast_home
    attribute: pressure
    id: wp_pressure
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: wp_pressure_value
            text:
              format: "%s inHg"
              args: ['id(wp_pressure).state.c_str()']

  # Wind speed
  - platform: homeassistant
    entity_id: weather.forecast_home
    attribute: wind_speed
    id: wp_wind_speed
    internal: true
    on_value:
      then:
        - script.execute: update_wind_display

  # Wind bearing
  - platform: homeassistant
    entity_id: weather.forecast_home
    attribute: wind_bearing
    id: wp_wind_bearing
    internal: true
    on_value:
      then:
        - script.execute: update_wind_display

# --- Globals for forecast conditions (used by icon update scripts) ---
globals:
  - id: forecast_condition_0
    type: std::string
    initial_value: '"unknown"'
  - id: forecast_condition_1
    type: std::string
    initial_value: '"unknown"'
  - id: forecast_condition_2
    type: std::string
    initial_value: '"unknown"'
  - id: forecast_condition_3
    type: std::string
    initial_value: '"unknown"'
  - id: forecast_condition_4
    type: std::string
    initial_value: '"unknown"'
  - id: forecast_condition_5
    type: std::string
    initial_value: '"unknown"'

# --- Scripts ---
script:
  # Update weather page condition icon from wp_weather_condition state
  - id: update_wp_condition_icon
    then:
      - lambda: |-
          std::string c = id(wp_weather_condition).state;
          if (c == "clear-night") lv_img_set_src(id(wp_weather_condition_icon), id(clear_night_100));
          else if (c == "cloudy") lv_img_set_src(id(wp_weather_condition_icon), id(cloudy_100));
          else if (c == "exceptional") lv_img_set_src(id(wp_weather_condition_icon), id(exceptional_100));
          else if (c == "fog") lv_img_set_src(id(wp_weather_condition_icon), id(fog_100));
          else if (c == "hail") lv_img_set_src(id(wp_weather_condition_icon), id(hail_100));
          else if (c == "lightning") lv_img_set_src(id(wp_weather_condition_icon), id(lightning_100));
          else if (c == "lightning-rainy") lv_img_set_src(id(wp_weather_condition_icon), id(lightning_rainy_100));
          else if (c == "partlycloudy") lv_img_set_src(id(wp_weather_condition_icon), id(partlycloudy_100));
          else if (c == "pouring") lv_img_set_src(id(wp_weather_condition_icon), id(pouring_100));
          else if (c == "rainy") lv_img_set_src(id(wp_weather_condition_icon), id(rainy_100));
          else if (c == "snowy") lv_img_set_src(id(wp_weather_condition_icon), id(snowy_100));
          else if (c == "snowy-rainy") lv_img_set_src(id(wp_weather_condition_icon), id(snowy_rainy_100));
          else if (c == "sunny") lv_img_set_src(id(wp_weather_condition_icon), id(sunny_100));
          else if (c == "windy") lv_img_set_src(id(wp_weather_condition_icon), id(windy_100));
          else if (c == "unavailable") lv_img_set_src(id(wp_weather_condition_icon), id(unavailable_100));
          else lv_img_set_src(id(wp_weather_condition_icon), id(unknown_100));

  # Update weather page condition text label
  - id: update_wp_condition_label
    then:
      - lvgl.label.update:
          id: wp_condition_label
          text: !lambda |-
            std::string c = id(wp_weather_condition).state;
            if (c == "clear-night") return std::string("Clear Night");
            if (c == "cloudy") return std::string("Cloudy");
            if (c == "exceptional") return std::string("Exceptional");
            if (c == "fog") return std::string("Foggy");
            if (c == "hail") return std::string("Hail");
            if (c == "lightning") return std::string("Lightning");
            if (c == "lightning-rainy") return std::string("Thunderstorm");
            if (c == "partlycloudy") return std::string("Partly Cloudy");
            if (c == "pouring") return std::string("Pouring");
            if (c == "rainy") return std::string("Rainy");
            if (c == "snowy") return std::string("Snowy");
            if (c == "snowy-rainy") return std::string("Sleet");
            if (c == "sunny") return std::string("Sunny");
            if (c == "windy") return std::string("Windy");
            return c;

  # Format wind display as "X.X mph (DIR)"
  - id: update_wind_display
    then:
      - lvgl.label.update:
          id: wp_wind_value
          text: !lambda |-
            float speed = 0;
            int bearing = 0;
            if (!id(wp_wind_speed).state.empty()) {
              speed = atof(id(wp_wind_speed).state.c_str());
            }
            if (!id(wp_wind_bearing).state.empty()) {
              bearing = atoi(id(wp_wind_bearing).state.c_str());
            }
            const char* directions[] = {
              "N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
              "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"
            };
            int idx = (int)((bearing + 11.25) / 22.5) % 16;
            char buf[32];
            snprintf(buf, sizeof(buf), "%.1f mph (%s)", speed, directions[idx]);
            return std::string(buf);

  # Fetch 6-day weather forecast from Home Assistant
  - id: fetch_weather_forecast
    then:
      - logger.log:
          level: INFO
          format: "Requesting weather forecast from Home Assistant..."
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            type: daily
            entity_id: weather.forecast_home
          capture_response: true
          response_template: >-
            {% set forecasts = response["weather.forecast_home"].forecast %}
            {% set result = {
              'hilo': (forecasts[0].temperature | default(0) | string) + '° / ' + (forecasts[0].templow | default(0) | string) + '°',
              'condition_0': forecasts[0].condition | default('unknown'),
              'temp_hi_0': forecasts[0].temperature | default(0) | string,
              'temp_lo_0': forecasts[0].templow | default(0) | string,
              'day_0': as_timestamp(forecasts[0].datetime) | timestamp_custom('%a'),
              'condition_1': forecasts[1].condition | default('unknown'),
              'temp_hi_1': forecasts[1].temperature | default(0) | string,
              'temp_lo_1': forecasts[1].templow | default(0) | string,
              'day_1': as_timestamp(forecasts[1].datetime) | timestamp_custom('%a'),
              'condition_2': forecasts[2].condition | default('unknown'),
              'temp_hi_2': forecasts[2].temperature | default(0) | string,
              'temp_lo_2': forecasts[2].templow | default(0) | string,
              'day_2': as_timestamp(forecasts[2].datetime) | timestamp_custom('%a'),
              'condition_3': forecasts[3].condition | default('unknown'),
              'temp_hi_3': forecasts[3].temperature | default(0) | string,
              'temp_lo_3': forecasts[3].templow | default(0) | string,
              'day_3': as_timestamp(forecasts[3].datetime) | timestamp_custom('%a'),
              'condition_4': forecasts[4].condition | default('unknown'),
              'temp_hi_4': forecasts[4].temperature | default(0) | string,
              'temp_lo_4': forecasts[4].templow | default(0) | string,
              'day_4': as_timestamp(forecasts[4].datetime) | timestamp_custom('%a'),
              'condition_5': forecasts[5].condition | default('unknown'),
              'temp_hi_5': forecasts[5].temperature | default(0) | string,
              'temp_lo_5': forecasts[5].templow | default(0) | string,
              'day_5': as_timestamp(forecasts[5].datetime) | timestamp_custom('%a')
            } %}
            {{ result | tojson }}
          on_success:
            - lambda: |-
                auto data = response["response"];

                // Store conditions in globals for icon updates
                id(forecast_condition_0) = data["condition_0"].as<std::string>();
                id(forecast_condition_1) = data["condition_1"].as<std::string>();
                id(forecast_condition_2) = data["condition_2"].as<std::string>();
                id(forecast_condition_3) = data["condition_3"].as<std::string>();
                id(forecast_condition_4) = data["condition_4"].as<std::string>();
                id(forecast_condition_5) = data["condition_5"].as<std::string>();

                ESP_LOGI("weather", "Forecast received - Day 0: %s %s°/%s°",
                    data["condition_0"].as<std::string>().c_str(),
                    data["temp_hi_0"].as<std::string>().c_str(),
                    data["temp_lo_0"].as<std::string>().c_str());

            # Update hi/lo
            - lvgl.label.update:
                id: wp_hilo_label
                text: !lambda 'return response["response"]["hilo"].as<std::string>();'

            # Update Day 0
            - lvgl.label.update:
                id: forecast_day_0
                text: !lambda 'return response["response"]["day_0"].as<std::string>();'
            - lvgl.label.update:
                id: forecast_hi_0
                text: !lambda 'return response["response"]["temp_hi_0"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: forecast_lo_0
                text: !lambda 'return response["response"]["temp_lo_0"].as<std::string>() + "°";'
            - script.execute: update_forecast_icon_0

            # Update Day 1
            - lvgl.label.update:
                id: forecast_day_1
                text: !lambda 'return response["response"]["day_1"].as<std::string>();'
            - lvgl.label.update:
                id: forecast_hi_1
                text: !lambda 'return response["response"]["temp_hi_1"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: forecast_lo_1
                text: !lambda 'return response["response"]["temp_lo_1"].as<std::string>() + "°";'
            - script.execute: update_forecast_icon_1

            # Update Day 2
            - lvgl.label.update:
                id: forecast_day_2
                text: !lambda 'return response["response"]["day_2"].as<std::string>();'
            - lvgl.label.update:
                id: forecast_hi_2
                text: !lambda 'return response["response"]["temp_hi_2"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: forecast_lo_2
                text: !lambda 'return response["response"]["temp_lo_2"].as<std::string>() + "°";'
            - script.execute: update_forecast_icon_2

            # Update Day 3
            - lvgl.label.update:
                id: forecast_day_3
                text: !lambda 'return response["response"]["day_3"].as<std::string>();'
            - lvgl.label.update:
                id: forecast_hi_3
                text: !lambda 'return response["response"]["temp_hi_3"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: forecast_lo_3
                text: !lambda 'return response["response"]["temp_lo_3"].as<std::string>() + "°";'
            - script.execute: update_forecast_icon_3

            # Update Day 4
            - lvgl.label.update:
                id: forecast_day_4
                text: !lambda 'return response["response"]["day_4"].as<std::string>();'
            - lvgl.label.update:
                id: forecast_hi_4
                text: !lambda 'return response["response"]["temp_hi_4"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: forecast_lo_4
                text: !lambda 'return response["response"]["temp_lo_4"].as<std::string>() + "°";'
            - script.execute: update_forecast_icon_4

            # Update Day 5
            - lvgl.label.update:
                id: forecast_day_5
                text: !lambda 'return response["response"]["day_5"].as<std::string>();'
            - lvgl.label.update:
                id: forecast_hi_5
                text: !lambda 'return response["response"]["temp_hi_5"].as<std::string>() + "°";'
            - lvgl.label.update:
                id: forecast_lo_5
                text: !lambda 'return response["response"]["temp_lo_5"].as<std::string>() + "°";'
            - script.execute: update_forecast_icon_5

          on_error:
            - logger.log:
                level: ERROR
                format: "Failed to fetch weather forecast from Home Assistant"

