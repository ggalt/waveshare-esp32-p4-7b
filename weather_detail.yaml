# --- Hourly forecast fetch script ---
  - id: fetch_hourly_forecast
    then:
      - logger.log:
          level: INFO
          format: "Requesting hourly weather forecast from Home Assistant..."
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            type: hourly
            entity_id: weather.forecast_home
          capture_response: true
          response_template: |-
            {% set forecasts = response["weather.forecast_home"].forecast %}
            {% set ns = namespace(result={}) %}
            {% for i in range([24, forecasts|length]|min) %}
              {% set hr = as_timestamp(forecasts[i].datetime) | timestamp_custom('%-I%p') %}
              {% set cond = forecasts[i].condition | default('unknown') %}
              {% set temp = forecasts[i].temperature | default(0) | round | string + '°' %}
              {% set ns.result = ns.result | combine({'h_' ~ i|string: hr ~ '|' ~ cond ~ '|' ~ temp}) %}
            {% endfor %}
            {{ ns.result | tojson }}
          on_success:
            - lambda: |-
                ESP_LOGI("weather", "Hourly forecast on_success triggered");
                auto data = response["response"];
                ESP_LOGI("weather", "Hourly forecast data keys: %d", data.size());

                // Icon setter - maps HA condition string to 40px icon
                auto set_icon = [](lv_obj_t* img, const std::string& c) {
                  if (c == "clear-night") lv_img_set_src(img, id(clear_night_40));
                  else if (c == "cloudy") lv_img_set_src(img, id(cloudy_40));
                  else if (c == "exceptional") lv_img_set_src(img, id(exceptional_40));
                  else if (c == "fog") lv_img_set_src(img, id(fog_40));
                  else if (c == "hail") lv_img_set_src(img, id(hail_40));
                  else if (c == "lightning") lv_img_set_src(img, id(lightning_40));
                  else if (c == "lightning-rainy") lv_img_set_src(img, id(lightning_rainy_40));
                  else if (c == "partlycloudy") lv_img_set_src(img, id(partlycloudy_40));
                  else if (c == "pouring") lv_img_set_src(img, id(pouring_40));
                  else if (c == "rainy") lv_img_set_src(img, id(rainy_40));
                  else if (c == "snowy") lv_img_set_src(img, id(snowy_40));
                  else if (c == "snowy-rainy") lv_img_set_src(img, id(snowy_rainy_40));
                  else if (c == "sunny") lv_img_set_src(img, id(sunny_40));
                  else if (c == "windy") lv_img_set_src(img, id(windy_40));
                  else lv_img_set_src(img, id(unknown_40));
                };

                lv_obj_t* time_labels[] = {
                  id(hourly_time_0), id(hourly_time_1), id(hourly_time_2), id(hourly_time_3),
                  id(hourly_time_4), id(hourly_time_5), id(hourly_time_6), id(hourly_time_7),
                  id(hourly_time_8), id(hourly_time_9), id(hourly_time_10), id(hourly_time_11),
                  id(hourly_time_12), id(hourly_time_13), id(hourly_time_14), id(hourly_time_15),
                  id(hourly_time_16), id(hourly_time_17), id(hourly_time_18), id(hourly_time_19),
                  id(hourly_time_20), id(hourly_time_21), id(hourly_time_22), id(hourly_time_23)
                };
                lv_obj_t* icons[] = {
                  id(hourly_icon_0), id(hourly_icon_1), id(hourly_icon_2), id(hourly_icon_3),
                  id(hourly_icon_4), id(hourly_icon_5), id(hourly_icon_6), id(hourly_icon_7),
                  id(hourly_icon_8), id(hourly_icon_9), id(hourly_icon_10), id(hourly_icon_11),
                  id(hourly_icon_12), id(hourly_icon_13), id(hourly_icon_14), id(hourly_icon_15),
                  id(hourly_icon_16), id(hourly_icon_17), id(hourly_icon_18), id(hourly_icon_19),
                  id(hourly_icon_20), id(hourly_icon_21), id(hourly_icon_22), id(hourly_icon_23)
                };
                lv_obj_t* temp_labels[] = {
                  id(hourly_temp_0), id(hourly_temp_1), id(hourly_temp_2), id(hourly_temp_3),
                  id(hourly_temp_4), id(hourly_temp_5), id(hourly_temp_6), id(hourly_temp_7),
                  id(hourly_temp_8), id(hourly_temp_9), id(hourly_temp_10), id(hourly_temp_11),
                  id(hourly_temp_12), id(hourly_temp_13), id(hourly_temp_14), id(hourly_temp_15),
                  id(hourly_temp_16), id(hourly_temp_17), id(hourly_temp_18), id(hourly_temp_19),
                  id(hourly_temp_20), id(hourly_temp_21), id(hourly_temp_22), id(hourly_temp_23)
                };

                int count = 0;
                for (int i = 0; i < 24; i++) {
                  char key[8];
                  snprintf(key, sizeof(key), "h_%d", i);
                  if (!data[key].is<std::string>()) continue;
                  std::string entry = data[key].as<std::string>();
                  size_t p1 = entry.find('|');
                  size_t p2 = entry.find('|', p1 + 1);
                  if (p1 == std::string::npos || p2 == std::string::npos) continue;

                  std::string time_str = entry.substr(0, p1);
                  std::string cond = entry.substr(p1 + 1, p2 - p1 - 1);
                  std::string temp = entry.substr(p2 + 1);

                  lv_label_set_text(time_labels[i], time_str.c_str());
                  set_icon(icons[i], cond);
                  lv_label_set_text(temp_labels[i], temp.c_str());
                  count++;
                }
                ESP_LOGI("weather", "Hourly forecast: updated %d hours", count);
                if (count == 0) {
                  ESP_LOGW("weather", "No hourly data parsed - check response_template");
                  std::string resp_str;
                  serializeJson(response, resp_str);
                  ESP_LOGW("weather", "Raw response (first 300): %.300s", resp_str.c_str());
                }

          on_error:
            - logger.log:
                level: ERROR
                format: "Failed to fetch hourly weather forecast from Home Assistant"

# --- Style tabview on boot (after LVGL init) ---
esphome:
  on_boot:
    - priority: 200
      then:
        - script.execute: style_forecast_tabview_dark

# --- Forecast refresh ---
interval:
  - interval: 3600s
    then:
      - script.execute: fetch_weather_forecast
      - script.execute: fetch_hourly_forecast

# --- Fetch forecast on HA connection ---
api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - delay: 5s
          - script.execute: fetch_weather_forecast
          - script.execute: fetch_hourly_forecast

