# WiFi offline banner
# A slim bar across the top of every page (LVGL top_layer) shown when WiFi
# has been disconnected for wifi_offline_delay seconds, so brief roams don't
# flash it. Hidden automatically on reconnect. Not shown while the boot
# screen (loading_page) is up, since that screen shows connection progress.
# Touch passes through to the page underneath (clickable: false).

substitutions:
  wifi_offline_delay: "5"

font:
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: mdi_wifi_32
    size: 32
    bpp: 8
    glyphs: [
      $mdi_wifi_off,
    ]

globals:
  - id: wifi_down_seconds
    type: int
    initial_value: '0'

lvgl:
  top_layer:
    widgets:
      - obj:
          id: wifi_offline_banner
          hidden: true
          align: TOP_MID
          width: 100%
          height: 48
          radius: 0
          border_width: 0
          pad_all: 0
          bg_color: crimson
          bg_opa: 90%
          clickable: false
          scrollable: false
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
            pad_column: 12
          widgets:
            - label:
                text_font: mdi_wifi_32
                text_color: white
                text: $mdi_wifi_off
            - label:
                text_font: nunito_24
                text_color: white
                text: "WiFi Offline - Reconnecting..."

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (wifi::global_wifi_component->is_connected()) {
            if (id(wifi_down_seconds) != 0) {
              id(wifi_down_seconds) = 0;
              lv_obj_add_flag(id(wifi_offline_banner), LV_OBJ_FLAG_HIDDEN);
            }
            return;
          }
          if (id(wifi_down_seconds) < ${wifi_offline_delay}) {
            id(wifi_down_seconds) += 1;
          }
          // Boot screen is up: it already reports connection progress
          if (!lv_obj_has_flag(id(loading_page), LV_OBJ_FLAG_HIDDEN)) {
            return;
          }
          if (id(wifi_down_seconds) >= ${wifi_offline_delay}) {
            lv_obj_clear_flag(id(wifi_offline_banner), LV_OBJ_FLAG_HIDDEN);
          }
